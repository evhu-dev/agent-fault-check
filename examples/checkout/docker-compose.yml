services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10

  fixture:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      AFC_FIXTURE_HOST: "0.0.0.0"
      AFC_FIXTURE_PORT: "8000"
      AFC_TEST_POSTGRES_DSN: "postgres://postgres:postgres@postgres:5432/agent_test?sslmode=disable"
    command: ["sh", "-c", "pip install --no-cache-dir psycopg[binary] && python3 fixture.py server"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
