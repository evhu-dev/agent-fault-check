<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentation &amp; FAQ — agent-fault-check (afc)</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <meta property="og:image" content="https://afc.evhu.net/logo.png">
  <meta name="description" content="Complete onboarding guide, chaos-spec.yaml reference, GitHub Action setup, SARIF rules, troubleshooting, and FAQ for agent-fault-check (afc).">
  <style>
    :root {
      --bg: #0c1026;
      --surface: #151c42;
      --surface-2: #1E2761;
      --border: #2d3975;
      --text: #eef1fa;
      --muted: #a6b0d1;
      --primary: #1E2761;
      --accent: #7A2048;
      --accent-hover: #962859;
      --link: #e58fb4;
      --green: #34d399;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

    header {
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
      position: sticky;
      top: 0;
      background: rgba(12, 16, 38, 0.94);
      backdrop-filter: blur(8px);
      z-index: 20;
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand:hover { text-decoration: none; }
    .release-badge {
      font-size: 0.72rem;
      font-family: var(--mono);
      background: rgba(122, 32, 72, 0.24);
      color: #f3b5cf;
      border: 1px solid rgba(122, 32, 72, 0.55);
      padding: 2px 9px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .release-badge:hover {
      background: rgba(122, 32, 72, 0.42);
      color: #fff;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 20px; align-items: center; font-size: 0.92rem; flex-wrap: wrap; }
    .nav-links a:not(.btn) { color: var(--muted); }
    .nav-links a:not(.btn):hover, .nav-links a.active { color: var(--text); text-decoration: none; }
    .nav-links a.btn-primary { color: #fff; }
    .btn {
      display: inline-block;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      border: 1px solid transparent;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); text-decoration: none; }

    .docs-layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 40px;
      padding: 36px 0 72px;
      align-items: start;
    }
    aside {
      position: sticky;
      top: 84px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      font-size: 0.88rem;
    }
    .toc-title {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 0 0 10px;
      font-weight: 700;
    }
    aside ul { list-style: none; padding: 0; margin: 0; }
    aside li { margin-bottom: 5px; }
    aside a {
      color: #cfd6ef;
      display: block;
      padding: 6px 10px;
      border-radius: 7px;
      transition: background 0.12s, color 0.12s;
    }
    aside a:hover { background: rgba(122, 32, 72, 0.22); color: #fff; text-decoration: none; }
    aside a.current {
      background: rgba(122, 32, 72, 0.34);
      border-left: 3px solid var(--accent);
      color: #fff;
      font-weight: 600;
    }

    main#doc-content { min-width: 0; }
    .md-body h1 { font-size: clamp(1.75rem, 3.2vw, 2.35rem); margin: 0 0 14px; letter-spacing: -0.02em; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .md-body h2 { font-size: 1.38rem; margin: 32px 0 12px; letter-spacing: -0.015em; }
    .md-body h3 { font-size: 1.06rem; margin: 24px 0 8px; color: #fff; }
    .md-body p { color: #cfd6ef; margin: 0 0 14px; }
    .md-body ul, .md-body ol { color: #cfd6ef; padding-left: 22px; margin: 0 0 16px; }
    .md-body li { margin-bottom: 6px; }
    .md-body code {
      font-family: var(--mono);
      background: var(--surface-2);
      color: #f3f5fc;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.86em;
    }
    .md-body pre {
      background: #090c1d;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      overflow-x: auto;
      font-family: var(--mono);
      font-size: 0.84rem;
      line-height: 1.55;
      color: #dbe3f8;
      margin: 0 0 18px;
    }
    .md-body pre code { background: none; padding: 0; font-size: inherit; }
    .md-body blockquote {
      margin: 16px 0 20px;
      background: rgba(30, 39, 97, 0.55);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 12px 16px;
      color: #dde3f7;
    }
    .md-body blockquote p:last-child { margin-bottom: 0; }
    .md-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0 22px;
      font-size: 0.9rem;
      display: block;
      overflow-x: auto;
    }
    .md-body th, .md-body td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .md-body th { background: var(--surface); color: #fff; font-weight: 600; white-space: nowrap; }
    .md-body td { color: #cfd6ef; }

    .doc-footer-nav {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 0.9rem;
    }
    .doc-pager { display: flex; gap: 12px; flex-wrap: wrap; }
    .pager-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
    }
    .pager-btn:hover { border-color: var(--link); text-decoration: none; }

    footer {
      border-top: 1px solid var(--border);
      padding: 36px 0;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }
    .footer-links { display: flex; gap: 18px; flex-wrap: wrap; }
    .footer-links a { color: var(--muted); }

    @media (max-width: 860px) {
      .docs-layout { grid-template-columns: 1fr; gap: 24px; }
      aside { position: static; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <div class="brand">
        <a class="brand" href="./">
          <img src="./logo.png" alt="evhu logo" width="28" height="28" style="border-radius:6px;display:block;">
          <span>agent-fault-check</span>
        </a>
        <a class="release-badge" data-release-link href="https://github.com/evhu-dev/agent-fault-check/releases/latest" target="_blank" rel="noopener">
          <span data-release-tag>v0.2.0</span> ↗
        </a>
      </div>
      <nav class="nav-links">
        <a href="./#how-it-works">How It Works</a>
        <a href="./#pricing">Pricing</a>
        <a class="active" href="./docs.html">Docs</a>
        <a href="https://github.com/evhu-dev/agent-fault-check">GitHub</a>
        <a href="mailto:support@evhu.net">Support</a>
        <a class="btn btn-primary" href="./#pricing">Get Pro</a>
      </nav>
    </div>
  </header>

  <div class="container docs-layout">
    <aside aria-label="Documentation navigation">
      <div class="toc-title">Documentation</div>
      <ul id="doc-nav"></ul>
    </aside>

    <main id="doc-content">
      <div id="md-body" class="md-body"><p>Loading documentation…</p></div>
      <div class="doc-footer-nav">
        <a id="edit-gh-link" href="https://github.com/evhu-dev/agent-fault-check/tree/main/docs/content" target="_blank" rel="noopener">Edit this page on GitHub ↗</a>
        <div class="doc-pager" id="doc-pager"></div>
      </div>
    </main>
  </div>

  <footer>
    <div class="container footer-inner">
      <div>© 2026 evhu · agent-fault-check</div>
      <div class="footer-links">
        <a href="./docs.html">Docs &amp; FAQ</a>
        <a href="./terms.html">Commercial Terms &amp; Refunds</a>
        <a href="./privacy.html">Privacy Policy</a>
        <a href="https://github.com/evhu-dev/agent-fault-check">OSS Repo</a>
        <a href="https://github.com/evhu-dev/agent-fault-check-releases">Pro Releases</a>
        <a href="mailto:support@evhu.net">support@evhu.net</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script>
    (function () {
      const PAGES = [
        { slug: "quickstart", title: "1. Quickstart & Install" },
        { slug: "how-it-works", title: "2. How the Proxy Works" },
        { slug: "chaos-spec", title: "3. chaos-spec.yaml Reference" },
        { slug: "faults-and-assertions", title: "4. Faults & Assertions" },
        { slug: "cli-reference", title: "5. CLI & Exit Codes" },
        { slug: "github-action", title: "6. GitHub Action & CI" },
        { slug: "sarif-rules", title: "7. SARIF Rules (AFC101–201)" },
        { slug: "licensing", title: "8. Pro & Team Licensing" },
        { slug: "troubleshooting", title: "9. Troubleshooting" },
        { slug: "faq", title: "10. FAQ" }
      ];

      const HASH_ALIASES = {
        "fault-strategies": "faults-and-assertions",
        "assertions": "faults-and-assertions"
      };

      let latestRelease = { tag: "v0.2.0", url: "https://github.com/evhu-dev/agent-fault-check/releases/latest" };

      async function fetchLatestRelease() {
        const cacheKey = "afc_latest_release_v1";
        try {
          const cached = JSON.parse(sessionStorage.getItem(cacheKey) || "null");
          if (cached && (Date.now() - cached.ts) < 600000) {
            latestRelease = { tag: cached.tag, url: cached.url };
            applyReleaseBadges();
            return;
          }
        } catch (_) {}
        try {
          const res = await fetch("https://api.github.com/repos/evhu-dev/agent-fault-check/releases/latest");
          if (res.ok) {
            const data = await res.json();
            if (data && data.tag_name) {
              latestRelease = { tag: data.tag_name, url: data.html_url || latestRelease.url };
              try {
                sessionStorage.setItem(cacheKey, JSON.stringify({ ...latestRelease, ts: Date.now() }));
              } catch (_) {}
              applyReleaseBadges();
            }
          }
        } catch (_) {}
      }

      function applyReleaseBadges() {
        document.querySelectorAll("[data-release-tag]").forEach(el => { el.textContent = latestRelease.tag; });
        document.querySelectorAll("[data-release-link]").forEach(el => { el.href = latestRelease.url; });
      }

      function resolveSlug() {
        const params = new URLSearchParams(window.location.search);
        const raw = (params.get("page") || window.location.hash.replace(/^#/, "") || "quickstart").toLowerCase();
        const mapped = HASH_ALIASES[raw] || raw;
        return PAGES.some(p => p.slug === mapped) ? mapped : "quickstart";
      }

      function buildSidebar(activeSlug) {
        const nav = document.getElementById("doc-nav");
        nav.innerHTML = PAGES.map(p =>
          `<li><a href="?page=${p.slug}" data-slug="${p.slug}" class="${p.slug === activeSlug ? "current" : ""}">${p.title}</a></li>`
        ).join("");
        nav.querySelectorAll("a").forEach(a => {
          a.addEventListener("click", (e) => {
            e.preventDefault();
            const slug = a.getAttribute("data-slug");
            history.pushState({}, "", `?page=${slug}`);
            loadPage(slug);
          });
        });
      }

      function renderMarkdown(md) {
        const ver = latestRelease.tag;
        const verNum = ver.replace(/^v/, "");
        const interpolated = md.replaceAll("{{VERSION}}", ver).replaceAll("{{VERSION_NUM}}", verNum);
        if (window.marked && typeof window.marked.parse === "function") {
          return window.marked.parse(interpolated, { gfm: true, breaks: false });
        }
        return `<pre>${interpolated.replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]))}</pre>`;
      }

      async function loadPage(slug) {
        buildSidebar(slug);
        const bodyEl = document.getElementById("md-body");
        const editEl = document.getElementById("edit-gh-link");
        const pagerEl = document.getElementById("doc-pager");
        editEl.href = `https://github.com/evhu-dev/agent-fault-check/blob/main/docs/content/${slug}.md`;

        const idx = PAGES.findIndex(p => p.slug === slug);
        const prev = idx > 0 ? PAGES[idx - 1] : null;
        const next = idx < PAGES.length - 1 ? PAGES[idx + 1] : null;
        pagerEl.innerHTML =
          (prev ? `<a class="pager-btn" href="?page=${prev.slug}" data-nav-slug="${prev.slug}">← ${prev.title}</a>` : "") +
          (next ? `<a class="pager-btn" href="?page=${next.slug}" data-nav-slug="${next.slug}">${next.title} →</a>` : "");
        pagerEl.querySelectorAll("a").forEach(a => {
          a.addEventListener("click", (e) => {
            e.preventDefault();
            const target = a.getAttribute("data-nav-slug");
            history.pushState({}, "", `?page=${target}`);
            loadPage(target);
            window.scrollTo({ top: 0, behavior: "smooth" });
          });
        });

        try {
          const res = await fetch(`./content/${slug}.md`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const md = await res.text();
          bodyEl.innerHTML = renderMarkdown(md);
          const pageMeta = PAGES[idx];
          if (pageMeta) document.title = `${pageMeta.title.replace(/^\d+\.\s*/, "")} — agent-fault-check Docs`;
        } catch (err) {
          bodyEl.innerHTML = `<p>Failed to load <code>docs/content/${slug}.md</code> (${err.message}).</p>`;
        }
      }

      window.addEventListener("popstate", () => loadPage(resolveSlug()));
      fetchLatestRelease().finally(() => loadPage(resolveSlug()));
    })();
  </script>
</body>
</html>
