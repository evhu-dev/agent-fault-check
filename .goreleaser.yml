version: 2

project_name: afc

before:
  hooks:
    - go mod tidy

builds:
  - id: afc
    main: ./cmd/afc
    binary: afc
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w
      - -X github.com/agent-fault-check/afc/internal/cli.Version={{.Version}}
      - -X github.com/agent-fault-check/afc/internal/cli.Commit={{.ShortCommit}}
      - -X github.com/agent-fault-check/afc/internal/license.UpgradeURL={{ if index .Env "AFC_UPGRADE_URL" }}{{ .Env.AFC_UPGRADE_URL }}{{ else }}https://polar.sh/evhu-dev{{ end }}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
