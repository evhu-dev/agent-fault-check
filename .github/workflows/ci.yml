name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run OSS vet & race tests
        run: |
          go vet ./...
          go test -timeout 60s -race ./...
      - name: Verify cross-platform static builds
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/afc
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/afc
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./cmd/afc

  postgres-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build OSS afc and install Postgres driver
        run: |
          go build -o ./afc ./cmd/afc
          python3 -m pip install --no-cache-dir "psycopg[binary]"
      - name: Verify OSS CLI against PostgreSQL (pass + duplicate-write fail)
        env:
          AFC_TEST_POSTGRES_DSN: "postgres://postgres:postgres@127.0.0.1:5432/agent_test?sslmode=disable"
        run: |
          set -euo pipefail
          ./afc validate --spec examples/checkout/chaos-spec.yaml
          python3 examples/checkout/fixture.py server > /tmp/fixture.log 2>&1 &
          FIXTURE_PID=$!
          trap 'kill "${FIXTURE_PID}" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if grep -q "LISTENING " /tmp/fixture.log; then
              break
            fi
            sleep 0.25
          done
          grep -q "LISTENING " /tmp/fixture.log

          # 1. Idempotent agent passes (exit 0)
          ./afc run --spec examples/checkout/chaos-spec.yaml --verbose

          # 2. Buggy duplicate-write agent fails sql_row_count (exit 1)
          sed 's/AGENT_MODE: "idempotent"/AGENT_MODE: "buggy_duplicate"/' examples/checkout/chaos-spec.yaml > examples/checkout/chaos-spec-dup.yaml
          trap 'rm -f examples/checkout/chaos-spec-dup.yaml; kill "${FIXTURE_PID}" 2>/dev/null || true' EXIT
          set +e
          ./afc run --spec examples/checkout/chaos-spec-dup.yaml --verbose
          RC=$?
          set -e
          if [ "${RC}" -ne 1 ]; then
            echo "expected exit code 1 for duplicate write, got ${RC}" >&2
            exit 1
          fi

  package-and-action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.8.2
          args: release --snapshot --clean
      - name: Verify checksums, archive extraction, and extracted OSS binary
        run: |
          set -euo pipefail
          TARBALL=$(cd dist && ls afc_*_linux_amd64.tar.gz)
          (cd dist && awk -v f="${TARBALL}" '$2 == f { print; found=1 } END { exit !found }' checksums.txt | sha256sum -c -)
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          tar -xzf "dist/${TARBALL}" -C "${TMPDIR}" afc
          "${TMPDIR}/afc" version
          "${TMPDIR}/afc" validate --spec examples/checkout/chaos-spec.yaml
      - name: Verify Action rejects paid report-mode without release-repository
        id: paid-guard
        continue-on-error: true
        uses: ./
        with:
          spec-path: "examples/checkout/chaos-spec.yaml"
          version: "v0.1.0"
          report-mode: "sarif"
      - name: Assert paid-mode guard failed cleanly
        run: |
          if [ "${{ steps.paid-guard.outcome }}" != "failure" ]; then
            echo "expected Action to fail when report-mode=sarif is used without release-repository" >&2
            exit 1
          fi

  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run lifecycle and proxy tests natively on macOS ARM64
        run: go test -timeout 60s -race ./internal/runner ./internal/proxy ./internal/cli
      - name: Build GoReleaser snapshot and verify macOS ARM64 archive install
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.8.2
          args: release --snapshot --clean
      - name: Verify macOS checksum, extraction, and binary execution
        run: |
          set -euo pipefail
          TARBALL=$(cd dist && ls afc_*_darwin_arm64.tar.gz)
          (
            cd dist
            CHECKSUM_LINE=$(awk -v f="${TARBALL}" '$2 == f { print; found=1 } END { exit !found }' checksums.txt)
            printf '%s\n' "${CHECKSUM_LINE}" | shasum -a 256 -c -
          )
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          tar -xzf "dist/${TARBALL}" -C "${TMPDIR}" afc
          BIN_DIR="${RUNNER_TEMP}/afc-bin"
          mkdir -p "${BIN_DIR}"
          install -m 0755 "${TMPDIR}/afc" "${BIN_DIR}/afc"
          "${BIN_DIR}/afc" version
          "${BIN_DIR}/afc" validate --spec examples/checkout/chaos-spec.yaml
