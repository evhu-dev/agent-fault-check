name: Pro / Team Support
description: Support request for licensed Pro or Team customers
labels: ["pro-support"]
body:
  - type: input
    id: prefix
    attributes:
      label: License key prefix (do NOT paste your full key)
      placeholder: "AFCPRO-XXXX or AFCTEAM-XXXX"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Issue details
      description: Include `afc version`, OS/CI environment, and redacted logs.
    validations:
      required: true
